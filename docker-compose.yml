services:
  eufylib:
    build: .
    image: eufylib
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8090
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - eufylib-data:/app/data
    restart: unless-stopped
    # a lock task can take 45 s; let it finish before docker kills the process
    stop_grace_period: 60s
    networks:
      - eufy-network

volumes:
  eufylib-data:

networks:
  eufy-network:
    external: true